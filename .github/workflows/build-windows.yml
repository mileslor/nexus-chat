name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the Windows build to'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build Windows installer
        run: npm run make:win

      - name: Locate installer
        id: find
        shell: bash
        run: |
          exe=$(find out/make -iname '*.exe' | head -1)
          echo "Found: $exe"
          echo "path=$exe" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.find.outputs.path }}
